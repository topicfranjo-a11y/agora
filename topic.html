{% extends "base.html" %}{% block content %}<h1>{{tema.naziv}}</h1><a class="btn" href="{{url_for('novo_misljenje',topic_id=tema.id)}}">+ Iznesi mišljenje</a>{% for m in misljenja %}<div class="card"><h2><a href="{{url_for('misljenje',misljenje_id=m.id)}}">{{m.tvrdnja}}</a></h2><p>{{m.korisnik_pseudonim}}</p><p class="muted">{{m.argument}}</p></div>{% else %}<p>Još nema mišljenja u ovoj temi.</p>{% endfor %}{% endblock %}
