{% extends "base.html" %}{% block title %}Tema · Admin{% endblock %}{% block content %}<section class="hero"><div class="label">ADMIN · TEMA</div><h1>{{"Nova tema" if mode=="new" else "Uredi temu"}}</h1></section><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Naziv<input name="title" value="{{topic.naziv if topic else ''}}" required></label><label>Uvod<textarea name="intro">{{topic.intro if topic else ''}}</textarea></label><label>Glavno pitanje<textarea name="question">{{topic.question if topic else ''}}</textarea></label><label>Cilj<textarea name="goal">{{topic.goal if topic else ''}}</textarea></label><label>Ključna pitanja<textarea name="key_questions">{{topic.key_questions if topic else ''}}</textarea></label><label>Pravila<textarea name="rules">{{topic.rules if topic else ''}}</textarea></label><label>AI kriteriji<textarea name="ai_criteria">{{topic.ai_criteria if topic else ''}}</textarea></label><label>Izvori<textarea name="sources">{{topic.sources if topic else ''}}</textarea></label>{% if mode=="edit" %}<label><input type="checkbox" name="active" {% if topic.aktivna %}checked{% endif %}> Aktivna</label>{% endif %}<button class="button primary">Spremi</button></form>{% endblock %}
