{% extends "base.html" %}
{% block title %}Tema · Admin{% endblock %}

{% block content %}
<section class="hero">
  <div class="label">ADMIN · TEMA</div>
  <h1>{{ "Nova tema" if mode=="new" else "Uredi temu" }}</h1>
  <p class="muted">Definiraj temu, pitanje, cilj i pravila rasprave.</p>
</section>

<form method="post" class="card editor admin-topic-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div class="topic-field topic-full">
    <label for="title">Naziv teme</label>
    <input id="title" name="title" value="{{ topic.naziv if topic else '' }}" required>
  </div>

  <div class="topic-field">
    <label for="intro">Uvod</label>
    <textarea id="intro" name="intro" rows="5">{{ topic.intro if topic else '' }}</textarea>
  </div>

  <div class="topic-field">
    <label for="question">Glavno pitanje</label>
    <textarea id="question" name="question" rows="5">{{ topic.question if topic else '' }}</textarea>
  </div>

  <div class="topic-field">
    <label for="goal">Cilj</label>
    <textarea id="goal" name="goal" rows="5">{{ topic.goal if topic else '' }}</textarea>
  </div>

  <div class="topic-field">
    <label for="key_questions">Ključna pitanja</label>
    <textarea id="key_questions" name="key_questions" rows="5">{{ topic.key_questions if topic else '' }}</textarea>
  </div>

  <div class="topic-field">
    <label for="rules">Pravila</label>
    <textarea id="rules" name="rules" rows="5">{{ topic.rules if topic else '' }}</textarea>
  </div>

  <div class="topic-field">
    <label for="ai_criteria">AI kriteriji</label>
    <textarea id="ai_criteria" name="ai_criteria" rows="5">{{ topic.ai_criteria if topic else '' }}</textarea>
  </div>

  <div class="topic-field topic-full">
    <label for="sources">Izvori</label>
    <textarea id="sources" name="sources" rows="5">{{ topic.sources if topic else '' }}</textarea>
  </div>

  {% if mode=="edit" %}
  <label class="topic-active">
    <input type="checkbox" name="active" {% if topic.aktivna %}checked{% endif %}>
    <span>Aktivna tema</span>
  </label>
  {% endif %}

  <div class="topic-actions">
    <button type="submit" class="button primary">Spremi temu</button>
    <a class="button" href="{{ url_for('admin_v54') }}">Odustani</a>
  </div>
</form>
{% endblock %}
