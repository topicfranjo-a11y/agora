{% extends "base.html" %}{% block content %}<h1>Administracija</h1><h2>Teme</h2>{% for t in teme %}<div class="card"><b>{{t.naziv}}</b> · mišljenja: {{t.broj_misljenja}}</div>{% endfor %}<h2>Predviđanja</h2>{% for p in predvidjanja %}<div class="card"><b>{{p.predvidjanje}}</b><form method="post" action="{{url_for('admin_predvidjanje',pid=p.id)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="status">{% for s in ['otvoreno','ostvareno','nije_ostvareno','djelomicno','neprovjerljivo'] %}<option value="{{s}}" {% if p.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><input name="ishod" placeholder="Ishod"><input name="biljeska" placeholder="Bilješka"><button class="btn">Spremi</button></form></div>{% endfor %}{% endblock %}
