{% extends "base.html" %}{% block title %}Sudjeluj — {{topic.title}}{% endblock %}{% block content %}<a class="back" href="{{url_for('topic',topic_id=topic.id)}}">← Povratak na temu</a><section class="hero"><div class="label">ARGUMENT</div><h1>Izgradi mišljenje koje može preživjeti kritiku.</h1><p>{{topic.question}}</p></section><form method="post" action="{{url_for('save_opinion',topic_id=topic.id)}}" class="editor"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>TVRDNJA<textarea name="claim" required placeholder="Što točno tvrdite?"></textarea></label><label>ARGUMENT<textarea name="argument" placeholder="Zašto to tvrdite? Koja veza povezuje premise i zaključak?"></textarea></label><label>DOKAZ<textarea name="evidence_text" placeholder="Koji podaci, izvori ili opažanja podupiru tvrdnju?"></textarea></label><label>PRETPOSTAVKE<textarea name="assumptions_text" placeholder="Što morate pretpostaviti da bi argument vrijedio?"></textarea></label><label>KONTRAARGUMENT<textarea name="counterargument_text" placeholder="Koji je najozbiljniji argument protiv vašeg stava?"></textarea></label><label>ZAKLJUČAK<textarea name="conclusion" placeholder="Što iz svega zaključujete?"></textarea></label><fieldset><legend>PREDVIĐANJE — zaključajte svoj pogled u vremenu</legend><label>Predviđanje<textarea name="prediction_text" placeholder="Što očekujete da će se dogoditi?"></textarea></label><label>Datum provjere<input type="date" name="target_date"></label></fieldset><button class="primary">Spremi mišljenje i predviđanje</button></form>{% endblock %}
